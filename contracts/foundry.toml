[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Fuzzing
fuzz = { runs = 256 }
invariant = { runs = 32, depth = 32 }

# Verbose errors
verbosity = 2

# Gas reports (only when --gas-report is passed)
gas_reports = ["*"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
